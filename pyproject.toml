[project]
name = "adlab"
version = "0.1.0"
description = "Unsupervised time-series anomaly detection, from scratch, for learning"
requires-python = ">=3.12"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=7", "scikit-learn>=1.3", "matplotlib>=3.7"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "slow: re-runs the full benchmark to check the lessons; skip with -m 'not slow'",
]
